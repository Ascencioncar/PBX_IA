[project]
name = "pbx-ia"
version = "0.1.0"
description = "Agente de voz para PBX (STT + LLM con tool calling + TTS, AudioSocket)."
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["webui/frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "E702"]  # E501 líneas largas; B008 Depends() FastAPI; E702 one-liners del benchmark

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
