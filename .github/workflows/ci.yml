name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias (núcleo + tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install ruff==0.9.* pytest==8.*
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Imágenes ligeras (agente y webui). La imagen de voz arrastra torch/whisper/
      # kokoro (pesada); se construye en el despliegue, no en cada push.
      - name: Build agente
        run: docker build -f Dockerfile -t pbx-ia/agent:ci .
      - name: Build webui
        run: docker build -f Dockerfile.webui -t pbx-ia/webui:ci .
