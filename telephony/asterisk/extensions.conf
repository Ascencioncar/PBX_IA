; Dialplan — plan.md §7.3.  Marcar 100 enruta la llamada al agente (AudioSocket).
; El UUID se genera leyendo /proc/sys/kernel/random/uuid (no requiere 'uuidgen').
; 'audiosocket' es el nombre del servicio Docker (servidor Python en :9000).

[from-internal]
exten => 100,1,Answer()
 same => n,Set(UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,Verbose(1,Conectando a AudioSocket UUID=${UUID})
 same => n,AudioSocket(${UUID},audiosocket:9000)
 same => n,Hangup()

; Eco para diagnosticar audio del softphone sin IA (marcar 600).
; (Sin Playback: el archivo demo-echotest no existe en esta imagen.)
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()
