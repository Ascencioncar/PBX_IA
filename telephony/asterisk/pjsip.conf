; PJSIP de laboratorio — plan.md §7.2.  CAMBIAR la contraseña.
; Softphone se registra como 1001 y marca 100 (agente) o 600 (eco).
;
; NAT/Docker: el softphone (en el host Windows) ve a Asterisk en 127.0.0.1 (puertos
; mapeados). Asterisk DEBE anunciar 127.0.0.1 en el SDP, no su IP de contenedor
; (172.18.x). Por eso external_*_address=127.0.0.1 y SIN local_net (así trata al
; teléfono como "externo" y le da la dirección alcanzable).

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=127.0.0.1
external_signaling_address=127.0.0.1

[1001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=1001
aors=1001
; --- NAT: imprescindible para que el RTP fluya desde/hacia el softphone ---
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1001]
type=auth
auth_type=userpass
username=1001
password=pbxlab1001

[1001]
type=aor
max_contacts=1
